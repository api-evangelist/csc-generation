- name: Seattle Coffee Gear Agent Commerce (UCP)
  description: 'Seattle Coffee Gear, a CSC Generation brand, publishes a Universal Commerce
    Protocol merchant profile at /.well-known/ucp declaring UCP 2026-04-08 (Shopify-native)
    with MCP and embedded transports, plus its own agent instructions at /llms.txt and
    /agents.md covering the six-step search-to-checkout flow, the buyer-approval rule, rate
    limits and an unauthenticated read-only storefront JSON surface. Anonymous tools/list
    returns 422 invalid_profile_url — the store requires the calling agent to present its own
    UCP profile URI.'
