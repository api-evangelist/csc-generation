aid: csc-generation
name: CSC Generation
description: 'CSC Generation is an AI-native retail holding company that acquires overlooked
  store- and catalogue-based retailers and rebuilds them on Genesis, its agent-orchestrated
  operating platform. Genesis combines a Data Fabric — a Data Management Platform that
  ingests and normalizes data across every brand without replatforming, and a Data Intelligence
  Platform that turns it into decision-ready signals for operators and AI agents — with an
  automation engine, proprietary retail AI tools, and centralized shared services covering
  customer experience, supply chain, technology and compliance. The company powers 13 brands
  and more than $1B in revenue, including Backcountry, Competitive Cyclist, Steep & Cheap,
  MotoSport, BikeTiresDirect, Level Nine Sports, Sur La Table, One Kings Lane, Seattle Coffee
  Gear and Home Consignment Center, and operates from Chicago, Austin, Los Angeles, Toronto,
  Seattle and Salt Lake City. CSC Generation publishes no corporate developer API; its
  machine-readable surface is per-brand — portfolio storefronts advertise Universal Commerce
  Protocol (UCP) merchant profiles at /.well-known/ucp that point agents at MCP endpoints for
  catalog search, cart and checkout.'
